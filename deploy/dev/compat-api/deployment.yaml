apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeai-compat-api
  namespace: forgeai-system
  labels:
    app.kubernetes.io/name: forgeai-compat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgeai-compat-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgeai-compat-api
    spec:
      serviceAccountName: forgeai-compat-api
      imagePullSecrets:
      - name: forgeai-registry
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: compat-api
        image: ko://github.com/scclabs/forgeai/compat-api/cmd/compat-api
        env:
        - name: NAMESPACE
          value: pod-prod
        - name: FORGEAI_NAMESPACE
          value: forgeai-system
        - name: TZ
          value: Asia/Shanghai
        envFrom:
        # Every APIKEY* entry is an accepted API key.
        - secretRef:
            name: forgeai-compat-api-keys
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: "1", memory: 256Mi}
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: forgeai-compat-api
  namespace: forgeai-system
spec:
  selector:
    app.kubernetes.io/name: forgeai-compat-api
  ports:
  - name: http
    port: 80
    targetPort: http
