# forgeai platform config for bz1-dev1.
namespacePrefix: forge-
apiServer: https://219.146.211.38:6443
# ingress-nginx is reachable from outside on 7443; *.dev1.bz1.paratera.com has
# wildcard DNS and a default wildcard certificate.
ingress:
  className: nginx
  domain: dev1.bz1.paratera.com
  port: 7443
# Sandbox ports published through the Gateway API (gateway.yaml). The listener
# is in-cluster on 8081; the external URL is not wired yet.
gateway:
  name: forgeai-sandbox
  namespace: llmapi
  scheme: http
  port: 8081
registry:
  domain: cr.dev1.bz1.paratera.com:7443
  insecure: true
  adminSecret: forgeai-harbor
# bz1-dev1 cannot reach the public registries directly; mir.blsc.cn proxies them
# as mir.blsc.cn/<registry>. gn-10-243-145-103 has no Security Profiles Operator
# daemon (its pod sandbox cannot start), so it lacks the build seccomp profile.
build:
  registryMirrors:
    docker.io: mir.blsc.cn/docker.io
    gcr.io: mir.blsc.cn/gcr.io
    ghcr.io: mir.blsc.cn/ghcr.io
    k8s.gcr.io: mir.blsc.cn/k8s.gcr.io
    registry.k8s.io: mir.blsc.cn/registry.k8s.io
    nvcr.io: mir.blsc.cn/nvcr.io
    quay.io: mir.blsc.cn/quay.io
  excludeNodes: [gn-10-243-145-103]
storageTypes:
  shared: {storageClass: shared-vast-cs, description: VAST shared filesystem}
  juicefs: {storageClass: shared-juice, description: JuiceFS shared filesystem}
defaultStorageType: shared
instanceTypes:
  reserved: {cpu: "8", memory: 64Gi}
  sizes: [1, 2, 4, 8]
defaultQuota:
  gpus: {"*": 8}
  storage: 2Ti
  volumes: 20
  pods: 100
  headroom: {cpu: "4", memory: 8Gi}
network:
  systemNamespaces: [ingress-nginx, ingress-nginx-cs, forgeai-system, kube-system, gpu-operator]
fileServer:
  idleTimeout: 30m
sandbox:
  # agent-sandbox is installed in agent-sandbox-system.
  namespace: agent-sandbox-system
  defaultImage: registry.k8s.io/agent-sandbox/python-runtime-sandbox:v0.1.0
  # The gvisor/kata RuntimeClass objects exist on bz1-dev1 but no node has the
  # runsc/kata handlers configured ("no runtime for ... is configured"), so
  # sandboxes run on the node runtime (runc) here. List a runtime class under
  # runtimeClasses once the handlers are installed on the nodes, then it
  # becomes selectable in the GUI.
  runtimeClasses: []
  # Suspend a sandbox that no client used for 30m (0 disables it).
  idleTimeout: 30m
training:
  defaultRuntime: torch-distributed
  shmSize: 16Gi
  stuckTimeout: 15m
  maxRetries: 0
inference:
  # bz1-dev1 cannot reach huggingface.co; weights come through the mirror.
  hfEndpoint: https://hf-mirror.com
  # Weights are tens of GB: keep them across restarts on shared storage.
  cache: {storageClass: shared-vast-cs, size: 200Gi}
  # A cold start downloads the weights over the mirror at ~5 MB/s, which takes
  # longer than the default; give it the time to finish.
  startupTimeout: 2h
trashRetention: 168h
