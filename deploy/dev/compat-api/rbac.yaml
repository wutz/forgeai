apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgeai-compat-api
  namespace: forgeai-system
---
# Job namespace: TrainingJobs, volumes (PVCs), image warmups.
# No pods/exec, secrets or services: users can not reach into pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgeai-compat-api
  namespace: pod-prod
rules:
- apiGroups: [forgeai.scclabs.dev]
  resources: [trainingjobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [persistentvolumeclaims]
  verbs: [get, list, create, patch, delete]
- apiGroups: [apps]
  resources: [daemonsets]
  verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgeai-compat-api
  namespace: pod-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgeai-compat-api
subjects:
- kind: ServiceAccount
  name: forgeai-compat-api
  namespace: forgeai-system
---
# Platform namespace: read the platform ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgeai-compat-api-config
  namespace: forgeai-system
rules:
- apiGroups: [""]
  resources: [configmaps]
  resourceNames: [forgeai-platform]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgeai-compat-api-config
  namespace: forgeai-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgeai-compat-api-config
subjects:
- kind: ServiceAccount
  name: forgeai-compat-api
  namespace: forgeai-system
---
# Cluster-wide: capacity (node allocatable minus pod requests).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forgeai-compat-api
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [list]
- apiGroups: [""]
  resources: [pods]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgeai-compat-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forgeai-compat-api
subjects:
- kind: ServiceAccount
  name: forgeai-compat-api
  namespace: forgeai-system
