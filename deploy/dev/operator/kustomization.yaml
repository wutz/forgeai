apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../config/default
patches:
# Image builds wait for user namespaces, so the dev cluster has no ImageBuild
# CRD and no grants for it. The test ops fail the build if the rules moved.
- target:
    kind: CustomResourceDefinition
    name: imagebuilds.forgeai.wutz.dev
  patch: |-
    $patch: delete
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: imagebuilds.forgeai.wutz.dev
- target:
    kind: ClusterRole
    name: forgeai-project-edit
  patch: |-
    - op: test
      path: /rules/11/resources
      value: [imagebuilds]
    - op: remove
      path: /rules/11
- target:
    kind: ClusterRole
    name: forgeai-project-view
  patch: |-
    - op: test
      path: /rules/8/resources
      value: [imagebuilds]
    - op: remove
      path: /rules/8
- target:
    kind: Deployment
    name: forgeai-controller-manager
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: ko://github.com/wutz/forgeai/cmd
    - op: replace
      path: /spec/template/spec/containers/0/command
      value: ["/ko-app/cmd"]
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: "1", memory: 512Mi}
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: FORGEAI_NAMESPACE
        value: forgeai-system
