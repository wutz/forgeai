apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeai-compat-api
  namespace: forgeai-system
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - forgeai.dev1.bz1.paratera.com
  rules:
  - host: forgeai.dev1.bz1.paratera.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: forgeai-compat-api
            port:
              name: http
