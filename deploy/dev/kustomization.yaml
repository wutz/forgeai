# Dev cluster (bz1-dev1) deployment.
#   make deploy-dev        # ko builds images and applies this overlay
# Images are public on ghcr.io/scclabs/forgeai. The compat-api API key secret
# is created out of band:
#   kubectl -n forgeai-system create secret generic forgeai-compat-api-keys --from-literal=APIKEY=<key>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- operator
- platform
- compat-api
