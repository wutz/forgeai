<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <title>forgeai</title>
    <!-- Set the theme before the first paint so a dark system never flashes light.
         A theme the user picked in the top bar (forgeai.theme) wins over the system. -->
    <script>
        (function () {
            var saved = localStorage.getItem('forgeai.theme')
            var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : system
        })()
    </script>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
